<div id="audioDevice" *ngIf="music">
    <img [src]="music.image" alt="Capa da música">
    <div id="title">
      <h2>{{ music.name }}</h2>
      <p>{{ music.artist }}</p>
    </div>
    <audio controls>
      <source [src]="music.audio" type="audio/mp3">
      Seu navegador não suporta a tag de áudio.
    </audio>
  </div>
